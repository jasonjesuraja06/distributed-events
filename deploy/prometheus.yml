global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # The consumer service runs with replicas > 1 and therefore publishes no host
  # port. Compose's embedded DNS returns one A record per replica for the
  # service name, so DNS service discovery scrapes every replica; a static
  # target would resolve to whichever single replica the resolver returned.
  - job_name: "consumer"
    dns_sd_configs:
      - names: ["consumer"]
        type: A
        port: 9100

  - job_name: "baseline-consumer"
    dns_sd_configs:
      - names: ["baseline-consumer"]
        type: A
        port: 9101
