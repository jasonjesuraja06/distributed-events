global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "consumer"
    dns_sd_configs:
      - names: ["tasks.consumer"]
        type: A
        port: 9100
    static_configs:
      - targets:
          - "consumer:9100"

  - job_name: "baseline-consumer"
    static_configs:
      - targets:
          - "baseline-consumer:9101"

  - job_name: "downstream"
    static_configs:
      - targets:
          - "downstream:8081"
